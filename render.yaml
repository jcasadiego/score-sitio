# Blueprint de Render para el sitio de SCORE.
# Sitio estático puro (HTML/CSS/JS, React via CDN). Sin build.
# Este archivo lo mantiene José.

services:
  - type: web
    name: score-sitio-qa
    runtime: static
    branch: develop
    staticPublishPath: .
    routes:
      - type: redirect
        source: /
        destination: /version-c/
    autoDeployTrigger: checksPass
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; connect-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self' https:; frame-ancestors 'none'; upgrade-insecure-requests"
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), geolocation=(), microphone=(), payment=(), usb=()
