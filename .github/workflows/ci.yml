name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  # El nombre del job es el check requerido de `develop` y `main`: no cambiarlo.
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      # Las actions van fijadas por SHA (Dependabot las actualiza).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Node 20 ya no recibe parches de seguridad.
          node-version: "22"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Auditar dependencias (alta o crítica)
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Build (exporta el sitio estático e incluye el chequeo de tipos)
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: "https://api.invalid"
