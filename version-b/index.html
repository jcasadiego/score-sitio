.btn-p{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:0 28px;border-radius:999px;border:0;color:#fff;text-decoration:none;font:inherit;font-size:15.5px;font-weight:500;cursor:pointer;background:linear-gradient(135deg,var(--a),color-mix(in srgb,var(--a) 45%,var(--b)));box-shadow:inset 0 0 0 1px rgba(255,255,255,.2),0 12px 44px -10px color-mix(in srgb,var(--a) 80%,transparent);transition:transform .3s,box-shadow .3s;overflow:hidden;isolation:isolate}
.btn-p::after{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-120%);animation:sheen 3.8s ease-in-out infinite}
.btn-p:hover{color:#fff;transform:translateY(-3px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.3),0 18px 60px -8px color-mix(in srgb,var(--a) 90%,transparent)}
.btn-g{display:inline-flex;align-items:center;gap:10px;min-height:54px;padding:0 24px;border-radius:999px;color:#fff;text-decoration:none;font-size:15px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(10px);transition:background .3s,border-color .3s}
.btn-g:hover{color:#fff;background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.3)}
.micro{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font-size:13px;color:#B5B7BA}
.micro span{display:inline-flex;align-items:center;gap:6px}
.micro b{display:block;width:5px;height:5px;border-radius:50%;background:var(--b)}
.ib{display:inline-flex;width:44px;height:44px;border-radius:50%;align-items:center;justify-content:center;color:#fff;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);transition:background .25s}
.ib:hover{color:#fff;background:rgba(255,255,255,.14)}
.arw{display:inline-flex;flex:none;width:36px;height:36px;border-radius:50%;align-items:center;justify-content:center;color:#000000;background:#fff;transition:transform .35s,background .35s}
.lk{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;padding-top:16px;border-top:1px solid rgba(255,255,255,.1);color:#fff;text-decoration:none;font-size:14px;position:relative;z-index:4}
.lk:hover{color:#fff}
.lk:hover .arw{transform:rotate(-45deg);background:var(--b)}
.chip{display:inline-flex;align-items:center;gap:10px;padding:6px 16px 6px 6px;border-radius:999px;border:1px solid var(--ln);background:rgba(255,255,255,.03);font-size:13px;color:#D9DADC;backdrop-filter:blur(8px)}
.chip i{display:block;width:26px;height:26px;border-radius:50%;background:conic-gradient(from 0deg,var(--a),var(--b),var(--a));animation:spin 4s linear infinite;position:relative}
.chip i::after{content:'';position:absolute;inset:3px;border-radius:50%;background:#0B0B0B}
.ck{display:inline-flex;flex:none;width:22px;height:22px;border-radius:50%;align-items:center;justify-content:center;background:color-mix(in srgb,var(--b) 18%,transparent);color:var(--b)}
.hero-bg{position:absolute;inset:0;background:radial-gradient(900px 640px at 72% 32%,color-mix(in srgb,var(--a) 24%,transparent),transparent 62%),radial-gradient(620px 420px at 88% 74%,color-mix(in srgb,var(--b) 13%,transparent),transparent 60%),linear-gradient(180deg,#0C0C0C 0%,#050505 100%)}
.hero-lines{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:80px 80px;-webkit-mask-image:radial-gradient(ellipse 70% 60% at 65% 40%,#000 20%,transparent 75%);mask-image:radial-gradient(ellipse 70% 60% at 65% 40%,#000 20%,transparent 75%)}
.brain-wrap{position:absolute;top:70px;right:-7%;width:60%;height:820px;z-index:1}
.halo{position:absolute;left:50%;top:50%;width:520px;height:520px;margin:-260px 0 0 -260px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--a) 34%,transparent),transparent 65%);filter:blur(20px);animation:halo 5s ease-in-out infinite}
.hud{position:absolute;display:inline-flex;align-items:center;gap:10px;padding:9px 16px;border-radius:999px;background:rgba(14,14,14,.55);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(12px);font-size:12px;letter-spacing:.04em;color:#E6E7E8;animation:floaty 6s ease-in-out infinite;z-index:2}
.hud b{position:relative;display:block;width:8px;height:8px;border-radius:50%;background:var(--b);box-shadow:0 0 12px var(--b)}
.hud b::after{content:'';position:absolute;inset:0;border-radius:50%;border:1px solid var(--b);animation:ping 2s ease-out infinite}
.in1,.in2,.in3,.in4,.in5{animation:rise 1.1s cubic-bezier(.2,.8,.2,1) both}
.in2{animation-delay:.12s}.in3{animation-delay:.24s}.in4{animation-delay:.36s}.in5{animation-delay:.5s}
.card{position:relative;border-radius:28px;border:1px solid var(--ln);background:linear-gradient(180deg,#151515 0%,#0A0A0A 100%);overflow:hidden}
.card.hi{background:linear-gradient(165deg,color-mix(in srgb,var(--a) 58%,#0A0A0A) 0%,#1B1B1C 58%,#0A0A0A 100%);border-color:color-mix(in srgb,var(--a) 45%,transparent)}
.tilt{transform:perspective(1100px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .6s cubic-bezier(.2,.8,.2,1),box-shadow .4s,background .5s,border-color .5s;will-change:transform}
.tilt:hover{transition:transform .12s linear,box-shadow .4s,background .5s,border-color .5s;box-shadow:0 40px 80px -30px color-mix(in srgb,var(--a) 55%,transparent)}
.tilt::before{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:3;background:radial-gradient(420px circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.1),transparent 45%);opacity:0;transition:opacity .3s}
.tilt::after{content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;z-index:3;background:radial-gradient(280px circle at var(--mx,50%) var(--my,0%),var(--b),color-mix(in srgb,var(--a) 70%,transparent) 40%,transparent 72%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:0;transition:opacity .3s}
.tilt:hover::before,.tilt:hover::after{opacity:1}
.eq{display:flex;align-items:center;gap:7px;height:120px;transform:perspective(520px) rotateX(38deg) rotateY(-20deg);-webkit-box-reflect:below 10px linear-gradient(transparent 45%,rgba(255,255,255,.22))}
.eq span{display:block;width:7px;height:100%;border-radius:7px;background:linear-gradient(180deg,var(--b),var(--a));transform-origin:center;animation:eq 1.2s ease-in-out infinite;box-shadow:0 0 12px color-mix(in srgb,var(--a) 60%,transparent)}
.eq span:nth-child(2n){animation-duration:.85s;animation-delay:-.2s}
.eq span:nth-child(3n){animation-duration:1.5s;animation-delay:-.5s}
.eq span:nth-child(5n){animation-duration:.7s;animation-delay:-.9s}
.eq span:nth-child(7n){animation-duration:1.8s;animation-delay:-.3s}
.eq.flat{transform:none;-webkit-box-reflect:unset;height:28px;gap:4px}
.eq.flat span{width:3px;box-shadow:none;opacity:.35}
.eq.dim span{opacity:.25;box-shadow:none}
.fams{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.fam{min-height:360px;padding:26px;display:flex;flex-direction:column;gap:16px}
.fam blockquote{margin:0;flex:1;font-size:20px;line-height:1.4;color:#F5F5F5;font-weight:300}
.fam .when{font-size:13px;line-height:1.5;color:#C8C9CB}
.fam .when strong{color:#fff;font-weight:500}
.fam .fv{position:absolute;right:-60px;top:-60px;width:200px;height:200px;opacity:.25;transition:opacity .6s;transform-style:preserve-3d;perspective:700px;pointer-events:none}
.fam:hover .fv,.fam.hi .fv{opacity:1}
.fv i{position:absolute;border-radius:50%;border:1px solid color-mix(in srgb,var(--b) 60%,transparent)}
.fv i:nth-child(1){inset:0;transform:rotateX(66deg) rotateZ(0deg);animation:ring1 9s linear infinite}
.fv i:nth-child(2){inset:30px;transform:rotateX(-58deg) rotateY(28deg) rotateZ(0deg);animation:ring2 7s linear infinite;border-color:color-mix(in srgb,var(--a) 70%,transparent)}
.fv i:nth-child(3){inset:72px;border:0;background:radial-gradient(circle at 35% 30%,#fff,var(--a) 45%,transparent 72%);animation:halo 4s ease-in-out infinite}
.rstage{perspective:1600px}
.report{transform:rotateY(-14deg) rotateX(6deg);transform-style:preserve-3d;transition:transform .8s cubic-bezier(.2,.8,.2,1);animation:floaty 7s ease-in-out infinite}
.rstage:hover .report{transform:rotateY(-4deg) rotateX(2deg)}
.ring-c{position:relative;border-radius:31px;padding:1px;background:conic-gradient(from var(--ang),rgba(255,255,255,.1),var(--a),var(--b),rgba(255,255,255,.1) 40%,rgba(255,255,255,.1));animation:angspin 7s linear infinite;box-shadow:0 50px 120px -40px color-mix(in srgb,var(--a) 60%,transparent)}
.rcard{border-radius:30px;background:linear-gradient(180deg,#151515,#0C0C0C);padding:30px}
.rd{display:grid;grid-template-columns:110px minmax(0,1fr);gap:14px;align-items:center}
.rd span{font-size:14px;color:#E6E7E8}
.bar{height:10px;border-radius:10px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--a),var(--b));transform-origin:left;animation:grow 1.6s cubic-bezier(.2,.8,.2,1) both}
.sk{display:block;height:8px;border-radius:8px;background:rgba(255,255,255,.1)}
.fnd{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07)}
.fnd em{font-style:normal;flex:none;width:96px;font-size:12px;color:#E6E7E8}
.dot3{width:8px;height:8px;border-radius:50%;flex:none}
.rlist{display:flex;flex-direction:column;gap:26px}
.rli{display:flex;gap:18px}
.rli .n{flex:none;display:inline-flex;width:44px;height:44px;border-radius:14px;align-items:center;justify-content:center;font-family:'Questrial',monospace;font-size:13px;color:#fff;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12)}
.rli h3{font-size:19px;font-weight:400}
.rli p{margin-top:6px;font-size:15px;line-height:1.55;color:#B5B7BA}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;position:relative}
.rail{position:relative;height:2px;border-radius:2px;background:rgba(255,255,255,.1)}
.rail::before{content:'';position:absolute;inset:0;border-radius:2px;background:linear-gradient(90deg,var(--a),var(--b));opacity:.5}
.rail i{position:absolute;top:50%;left:0;width:140px;height:6px;margin-top:-3px;border-radius:6px;background:linear-gradient(90deg,transparent,var(--b),#fff);box-shadow:0 0 18px var(--b);animation:travel 4.5s cubic-bezier(.6,0,.4,1) infinite}
.step{padding:28px;display:flex;flex-direction:column;gap:14px;min-height:300px}
.step .big{font-size:64px;font-weight:200;line-height:1;background:linear-gradient(180deg,#fff,color-mix(in srgb,var(--a) 60%,#050505));-webkit-background-clip:text;background-clip:text;color:transparent}
.step h3{font-size:22px;font-weight:400}
.step p{font-size:15px;line-height:1.55;color:#C8C9CB;flex:1}
.pill{display:inline-flex;align-items:center;gap:8px;min-height:32px;padding:0 14px;border-radius:999px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);font-size:12.5px;color:#E6E7E8;white-space:nowrap;align-self:flex-start}
.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.fl4{padding:22px;display:flex;flex-direction:column;gap:10px}
.fl4 .t{font-family:'Questrial',monospace;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:#B5B7BA}
.fl4 h3{font-size:18px;font-weight:400;line-height:1.3}
.logo-ph{display:flex;align-items:center;justify-content:center;min-height:72px;border-radius:18px;border:1px dashed rgba(255,255,255,.2);font-family:'Questrial',monospace;font-size:11px;letter-spacing:.08em;color:#B5B7BA}
.cta{position:relative;border-radius:48px;overflow:hidden;border:1px solid rgba(255,255,255,.1);background:radial-gradient(900px 420px at 30% 112%,color-mix(in srgb,var(--a) 50%,transparent),transparent 70%),linear-gradient(180deg,#0E0E0F,#141415)}
.floor{position:absolute;left:-30%;right:-30%;bottom:-6%;height:50%;background-image:linear-gradient(color-mix(in srgb,var(--a) 55%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--a) 55%,transparent) 1px,transparent 1px);background-size:64px 64px;transform:perspective(420px) rotateX(62deg);transform-origin:center top;animation:grid 1.8s linear infinite;-webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 35%,#000 75%,transparent 100%);mask-image:linear-gradient(to bottom,transparent 0%,#000 35%,#000 75%,transparent 100%);opacity:.55}
.sun{position:absolute;left:28%;bottom:22%;width:520px;height:260px;margin-left:-260px;border-radius:260px 260px 0 0;background:linear-gradient(180deg,var(--b),var(--a) 60%,transparent);filter:blur(50px);opacity:.3;animation:halo 6s ease-in-out infinite}
.nx{display:flex;gap:16px;align-items:flex-start}
.nx .n{flex:none;display:inline-flex;width:32px;height:32px;border-radius:50%;align-items:center;justify-content:center;font-size:13px;color:#000000;background:#fff;font-weight:500}
.nx p{font-size:15.5px;line-height:1.55;color:#E6E7E8;padding-top:5px}
.fcard{border-radius:30px;background:linear-gradient(180deg,#141414,#0C0C0C);padding:34px}
.flabel{display:block;margin-bottom:8px;font-size:13px;color:#D9DADC}
.fi{display:block;width:100%;min-height:50px;padding:12px 16px;border-radius:14px;border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.04);color:#fff;font:inherit;font-size:15px;outline:none;transition:border-color .25s,box-shadow .25s,background .25s}
.fi::placeholder{color:#939598}
.fi:focus{border-color:var(--b);box-shadow:0 0 0 4px color-mix(in srgb,var(--b) 20%,transparent);background:rgba(255,255,255,.07)}
.fi.bad{border-color:#FB7185;box-shadow:0 0 0 4px rgba(251,113,133,.14)}
.ferr{display:block;margin-top:7px;font-size:12.5px;color:#FDA4AF}
.fpill{min-height:44px;padding:0 18px;border-radius:999px;border:1px solid rgba(255,255,255,.18);background:transparent;color:#D9DADC;font:inherit;font-size:14px;cursor:pointer;transition:background .3s,color .3s,border-color .3s,box-shadow .3s}
.fpill:hover{border-color:rgba(255,255,255,.4);color:#fff}
.fpill.on{background:#fff;color:#000000;border-color:#fff;box-shadow:0 8px 30px -6px color-mix(in srgb,var(--a) 70%,transparent)}
.chk{display:flex;gap:12px;align-items:flex-start;font-size:13.5px;line-height:1.5;color:#D1D3D4;cursor:pointer}
.chk input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--a);flex:none;cursor:pointer}
.btn-s{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;border:0;border-radius:999px;background:#fff;color:#000000;font:inherit;font-size:15.5px;font-weight:500;cursor:pointer;transition:transform .3s,box-shadow .3s}
.btn-s:hover{transform:translateY(-2px);box-shadow:0 18px 50px -12px color-mix(in srgb,var(--b) 80%,transparent)}
.okc{fill:none;stroke:var(--b);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:200;stroke-dashoffset:200;animation:draw 1.2s cubic-bezier(.4,0,.2,1) .2s forwards}
.faq{border-bottom:1px solid rgba(255,255,255,.09);border-radius:20px;transition:background .4s}
.faq.open{background:rgba(255,255,255,.045);border-bottom-color:transparent}
.faq-h{display:flex;align-items:center;gap:16px;width:100%;min-height:64px;padding:16px 18px;background:none;border:0;color:#F5F5F5;font:inherit;font-size:16px;text-align:left;cursor:pointer}
.faq-h span{flex:1}
.faq-i{position:relative;display:inline-flex;flex:none;width:32px;height:32px;border-radius:50%;background:#fff;transition:background .4s,transform .4s}
.faq-i::before,.faq-i::after{content:'';position:absolute;left:50%;top:50%;width:12px;height:2px;margin:-1px 0 0 -6px;border-radius:2px;background:#000000;transition:transform .4s}
.faq-i::after{transform:rotate(90deg)}
.faq.open .faq-i{background:var(--b);transform:rotate(180deg)}
.faq.open .faq-i::after{transform:rotate(0deg)}
.faq-b{padding:0 18px 22px;font-size:15px;line-height:1.65;color:#D1D3D4;max-width:640px;animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.svc{display:flex;flex-wrap:wrap;gap:10px}
.svc a{display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid rgba(255,255,255,.14);color:#fff;text-decoration:none;font-size:14px;letter-spacing:.06em;transition:background .3s,border-color .3s}
.svc a:hover{color:#fff;background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.3)}
.svc a span{font-size:12.5px;letter-spacing:0;color:#B5B7BA}
.svc .sv{display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:0 18px;border-radius:999px;border:1px dashed rgba(255,255,255,.24);color:#D9DADC;font-size:14px;letter-spacing:.06em}
.svc .sv span{font-size:12.5px;letter-spacing:0;color:#A7A9AC}
.soon{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border-radius:999px;background:color-mix(in srgb,var(--b) 14%,transparent);border:1px solid color-mix(in srgb,var(--b) 40%,transparent);font-family:'Questrial',monospace;font-size:11px;letter-spacing:.12em;color:#FFFFFF}
.soon b{display:block;width:7px;height:7px;border-radius:50%;background:var(--b);box-shadow:0 0 10px var(--b);animation:blink 1.4s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
.giant{position:relative;display:block;font-size:clamp(90px,23vw,340px);font-weight:600;line-height:.85;letter-spacing:-.02em;text-align:center;color:#050505;-webkit-text-stroke:2px rgba(255,255,255,.16);paint-order:stroke fill;user-select:none}
.giant::after{content:attr(data-t);position:absolute;inset:0;color:transparent;-webkit-text-stroke:0;background:linear-gradient(100deg,transparent 0 42%,color-mix(in srgb,var(--a) 70%,transparent) 50%,color-mix(in srgb,var(--b) 60%,transparent) 54%,transparent 62% 100%);background-size:260% 100%;-webkit-background-clip:text;background-clip:text;animation:sweep 7s linear infinite}
.fl{display:inline-flex;align-items:center;min-height:36px;color:#D1D3D4;text-decoration:none;font-size:15px;transition:color .25s}
.fl:hover{color:#fff}
@supports (animation-timeline: view()){.rv{animation:rise linear both;animation-timeline:view();animation-range:entry 0% cover 24%}}
.pg.still *,.pg.still *::before,.pg.still *::after{animation-play-state:paused !important}
@keyframes shim{to{background-position:300% 0}}
@keyframes sheen{0%,55%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes floaty{0%,100%{translate:0 0}50%{translate:0 -14px}}
@keyframes eq{0%,100%{transform:scaleY(.22)}50%{transform:scaleY(1)}}
@keyframes ping{0%{transform:scale(1);opacity:.9}100%{transform:scale(3.2);opacity:0}}
@keyframes ring1{to{transform:rotateX(72deg) rotateZ(360deg)}}
@keyframes ring2{to{transform:rotateX(-58deg) rotateY(28deg) rotateZ(360deg)}}
@keyframes grid{to{background-position:0 64px}}
@keyframes halo{0%,100%{scale:1;opacity:.75}50%{scale:1.08;opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes rise{from{opacity:0;translate:0 48px;rotate:x 14deg}to{opacity:1;translate:0 0;rotate:x 0deg}}
@keyframes sweep{0%{background-position:130% 0}100%{background-position:-30% 0}}
@keyframes travel{0%{left:-140px;opacity:0}15%{opacity:1}85%{opacity:1}100%{left:100%;opacity:0}}
@keyframes angspin{to{--ang:360deg}}
@media (max-width:1000px){
.brain-wrap{width:100% !important;right:0 !important;top:150px !important;height:540px !important;opacity:.45}
.g2,.steps,.flow,.faqg,.logos{grid-template-columns:minmax(0,1fr) !important}
.fams{display:flex !important;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:12px}
.fams>*{flex:0 0 82%;scroll-snap-align:start}
.report{transform:none}
.f2{grid-template-columns:minmax(0,1fr) !important}
.fcard,.rcard{padding:24px}
}
.mtoggle{display:none;position:relative;flex:none;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);cursor:pointer;align-items:center;justify-content:center;flex-direction:column;gap:6px}
